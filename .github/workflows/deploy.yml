# Builds the site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the GitHub repository:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables tab:
#     VITE_SUPABASE_URL       your Supabase project URL
#     VITE_SUPABASE_ANON_KEY  your Supabase anon / publishable key (safe to be public)
#     CUSTOM_DOMAIN           optional, e.g. sound.co.za (leave unset to use <user>.github.io/<repo>/)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # With a custom domain the site lives at "/", otherwise at "/<repo>/".
          VITE_BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}
      - name: Add custom domain
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
